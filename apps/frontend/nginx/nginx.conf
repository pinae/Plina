# Plina's nginx (README: Deployment with Docker): the frontend, /api/ and
# /django/ (admin) proxied to the backend container, the admin's static files
# and the media from the volumes the backend fills. Ansible may replace this
# file with its own template before the image is built.

# The reverse proxy in front (TLS) says whether the page came over HTTPS.
map $http_x_forwarded_proto $plina_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream backend_server {
    server backend:5000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    # Plina has no login of its own yet: nginx asks for one. The users are in
    # /etc/nginx/htpasswd (mounted; README). Remove both lines only if the
    # reverse proxy in front asks for a login instead.
    auth_basic "Plina";
    auth_basic_user_file /etc/nginx/htpasswd;

    # For Docker, autoheal and the reverse proxy: no login, says only "ok".
    location = /healthz {
        auth_basic off;
        access_log off;
        proxy_pass http://backend_server;
    }

    location ~ ^/(api|django)/ {
        proxy_pass http://backend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $plina_forwarded_proto;
        # The login is nginx's; Django need not see the password.
        proxy_set_header Authorization "";
        proxy_read_timeout 120s;
    }

    # The admin's CSS/JS (collectstatic) and uploads, from the volumes.
    location /static/ {
        alias /app/static/;
    }
    location /media/ {
        alias /app/media/;
    }

    root /usr/share/nginx/html;

    # Vite's hashed bundles never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The single-page app: every other path is index.html, revalidated on
    # each load so an update is picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
