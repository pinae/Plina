# Plina's nginx (README: Deployment with Docker): the frontend, /api/ and
# /django/ (login with single sign-on, admin) proxied to the backend
# container, the admin's static files and the media from the volumes the
# backend fills. The login is Django's (README: Accounts).

# The reverse proxy in front (TLS) says whether the page came over HTTPS.
map $http_x_forwarded_proto $plina_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream backend_server {
    server backend:5000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 10m;

    # For Docker, autoheal and the reverse proxy: says only "ok".
    location = /healthz {
        access_log off;
        proxy_pass http://backend_server;
    }

    location ~ ^/(api|django)/ {
        proxy_pass http://backend_server;
        # The original Host, port included: Django builds absolute URLs from
        # it (the single sign-on's redirect URI).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $plina_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # The admin's CSS/JS (collectstatic) and uploads, from the volumes.
    location /static/ {
        alias /app/static/;
    }
    location /media/ {
        alias /app/media/;
    }

    root /usr/share/nginx/html;

    # Vite's hashed bundles never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The home-screen manifest (Add to home screen), with its own type.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The single-page app: every other path is index.html, revalidated on
    # each load so an update is picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
