# Example deployment of Plina (README: Deployment with Docker):
#
#   cp .env.example .env     # fill in the secrets and host names
#   docker compose up -d --build
#   docker compose exec backend python manage.py createsuperuser
#
# PostgreSQL, the Django backend (only reachable inside this project's
# network) and nginx (the frontend and the API proxy), published on
# PLINA_HTTP_BIND:PLINA_HTTP_PORT for the reverse proxy that terminates TLS.
# Logging in: local accounts, and single sign-on when OIDC_ is set (README).
name: plina

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-plina}
      POSTGRES_USER: ${DB_USER:-plina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-True}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-plina}
      DB_USER: ${DB_USER:-plina}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: 5432
      # Single sign-on (OpenID Connect): all or none of the first six.
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUTHORIZATION_ENDPOINT: ${OIDC_AUTHORIZATION_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
      OIDC_USER_ENDPOINT: ${OIDC_USER_ENDPOINT:-}
      OIDC_JWKS_ENDPOINT: ${OIDC_JWKS_ENDPOINT:-}
      OIDC_LOGOUT_ENDPOINT: ${OIDC_LOGOUT_ENDPOINT:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
    volumes:
      # Filled by the backend at start (collectstatic), served by nginx.
      - static:/app/static
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: apps/frontend/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${PLINA_HTTP_BIND:-127.0.0.1}:${PLINA_HTTP_PORT:-8080}:80"
    volumes:
      - static:/app/static:ro
      - media:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres:
  static:
  media:
